name: Build and Push Backend to AWS ECR

on:
  push:
    branches:
      - main

env:
  AWS_REGION: eu-north-1                  # My AWS EU-north Region
  ECR_REPOSITORY: netflix-backend   # Change to your ECR Repository Name

jobs:
  build-and-push:
    name: Build, Tag, and Push Image to AWS ECR
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Configure AWS Credentials using GitHub Repository Secrets
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Step 3: Log in to Amazon ECR
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Step 4: Build, Tag, and Push Docker Image
      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build the Docker image from your Backend Dockerfile
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          
          # Push both specific commit tag and 'latest' tag to AWS ECR
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        
    - name: Build and push Backend image to ECR
        uses: docker/build-push-action@v4
        with:
            context: ./netflix_backend    # Points to backend folder
            file: ./netflix_backend/Dockerfile
            push: true
            tags: ${{ steps.login-ecr.outputs.registry }}/netflix-backend:latest